<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura</title>
    <link rel="stylesheet" href="factura.css">
</head>
<body>
    <main>
        <article class="bill-content">
            <h1 class="bill-title">Factura Digital</h1>
            <h2>Factura #1001</h2>
            <h3>Fecha: 25/10/2026</h3>
            <ul>
                <li class="bill-service">
                    <div class="bill-service-cont">
                        <h4 class="bill-service-title">Servicio 1</h4>
                        <p class="bill-service-desc">Horas 1</p>
                    </div>
                    <span class="bill-service-cost">
                        $5000
                    </span>
                </li>
                <li class="bill-service">
                    <div class="bill-service-cont">
                        <h4 class="bill-service-title">Servicio 2</h4>
                        <p class="bill-service-desc">Horas 2</p>
                    </div>
                    <span class="bill-service-cost">
                        $5000
                    </span>
                </li>
                <li class="bill-total"><h3>Total: $10000</h3></li>
            </ul>
            <button class="bill-btn">Pagar factura</button>
        </article>
    </main>
</body>
</html>
